services:
  - type: web
    name: admention-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./admention.db
      - key: BACKEND_CORS_ORIGINS
        value: https://adverify.codewithbharat.dev
      - key: YOUTUBE_API_KEY
        sync: false
      # Logging — INFO shows every provider attempt in Render logs
      - key: LOG_LEVEL
        value: INFO
      # Whisper fallback — flip to true in Render dashboard for emergency mock fallback
      - key: WHISPER_ENABLED
        value: "false"
      - key: WHISPER_PROVIDER
        value: mock
      # ---------------------------------------------------------------
      # Proxy configuration — set ONE of the options below to allow all
      # YouTube videos to work on Render without manual fixture files.
      # ---------------------------------------------------------------
      # Option A: Generic HTTP proxy URL (any residential proxy provider)
      #   Format: http://username:password@proxy-host:port
      - key: HTTP_PROXY
        sync: false
      # Option B: Webshare residential proxy (recommended — free tier available)
      #   Sign up free at https://proxy.webshare.io/register
      #   Credentials at https://dashboard.webshare.io/proxy/settings
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
