services:
  - type: web
    name: admention-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./admention.db
      - key: BACKEND_CORS_ORIGINS
        value: https://adverify.codewithbharat.dev
      - key: YOUTUBE_API_KEY
        sync: false
